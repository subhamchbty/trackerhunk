<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>TrackerHunk</title>
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>
  <!-- Icons, referenced with <use href="#icon-name"> -->
  <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></symbol>
    <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10" /></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" stroke-width="2">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </symbol>
    <symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></symbol>
    <symbol id="i-next" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4" /></symbol>
    <symbol id="i-today" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" class="fill" /></symbol>
  </svg>

  <header class="titlebar">
    <div class="brand" title="TrackerHunk">
      <img class="brand-mark" src="../../assets/logo.svg" alt="" width="18" height="18" />
      <span class="brand-name">TrackerHunk</span>
    </div>
    <div class="titlebar-actions">
      <button id="open-settings" class="icon-button" type="button" title="Settings">
        <svg><use href="#i-settings" /></svg>
      </button>
      <button id="export" class="label-button" type="button" title="Export sessions to CSV">
        <svg><use href="#i-export" /></svg>
        <span>Export</span>
      </button>
    </div>
  </header>

  <main id="main" class="app">
    <section class="timer-card">
      <div id="current" class="current idle"></div>

      <div class="clock-wrap">
        <div id="clock" class="clock" title="Total for today">00:00:00</div>
        <div id="session" class="session"></div>
      </div>

      <button id="toggle" class="toggle" type="button">Start a task</button>
    </section>

    <section class="log">
      <header class="log-header">
        <div class="day-nav">
          <button id="day-prev" class="icon-button" type="button" title="Previous day"><svg><use href="#i-prev" /></svg></button>
          <div class="day-pick">
            <button id="day-label" class="day-label" type="button" title="Pick a date">Today</button>
            <input id="day-picker" class="day-picker" type="date" tabindex="-1" aria-label="Pick a date" />
          </div>
          <button id="day-next" class="icon-button" type="button" title="Next day"><svg><use href="#i-next" /></svg></button>
          <button id="day-today" class="icon-button today hidden" type="button" title="Back to today"><svg><use href="#i-today" /></svg></button>
        </div>
        <div class="project-row">
          <select id="project" class="project-select" title="Project"></select>
        </div>
        <div class="log-right">
          <span id="total" class="log-total">0m</span>
          <button id="add-entry" class="icon-button add" type="button" title="New task"><svg><use href="#i-plus" /></svg></button>
        </div>
      </header>
      <ul id="entries" class="entries"></ul>
      <p id="empty" class="empty">Nothing logged on this day.</p>
    </section>
  </main>

  <!-- Settings screen -->
  <section id="settings" class="settings hidden">
    <header class="settings-head">
      <button id="settings-back" class="icon-button" type="button" title="Back"><svg><use href="#i-back" /></svg></button>
      <h2 class="settings-title">Settings</h2>
    </header>

    <h3 class="settings-label">Projects</h3>
    <ul id="settings-projects" class="settings-list"></ul>
    <form id="settings-add" class="settings-add">
      <input id="settings-add-name" class="field" type="text" placeholder="New project" autocomplete="off" spellcheck="false" />
      <button class="button primary" type="submit">Add</button>
    </form>
    <p class="settings-note">Click a project name to rename it. Deleting a project removes all of its tasks and sessions.</p>

    <h3 class="settings-label">Data</h3>
    <button id="settings-export" class="button ghost" type="button">Export sessions to CSV</button>
  </section>

  <!-- New task / edit task / running timer -->
  <div id="modal" class="modal hidden">
    <form id="entry-form" class="modal-card" novalidate>
      <div class="modal-head">
        <h2 id="form-title" class="modal-title">New task</h2>
        <span id="form-day" class="modal-sub"></span>
      </div>

      <label class="form-label">
        <span>Project</span>
        <select id="f-project" class="field"></select>
      </label>

      <label class="form-label">
        <span>Task</span>
        <input id="f-task" class="field" type="text" autocomplete="off" spellcheck="false" />
      </label>

      <label class="form-label">
        <span>Description</span>
        <textarea id="f-description" class="field" rows="2" spellcheck="false"></textarea>
      </label>

      <label class="form-label">
        <span>Link</span>
        <input id="f-url" class="field" type="url" placeholder="https://" autocomplete="off" spellcheck="false" />
      </label>

      <div class="form-sessions">
        <div class="form-sessions-head">
          <span id="f-sessions-label">Sessions on this day</span>
          <button id="f-add-session" class="text-button" type="button">+ Add session</button>
        </div>
        <ul id="f-session-list" class="session-list"></ul>
      </div>

      <div class="form-foot">
        <span id="f-duration" class="form-duration"></span>
        <span id="f-error" class="form-error"></span>
      </div>

      <div class="modal-actions">
        <button id="f-cancel" class="button ghost" type="button">Cancel</button>
        <button id="f-log" class="button ghost" type="button">Log time</button>
        <button id="f-save" class="button primary" type="submit">Start timer</button>
      </div>
    </form>
  </div>

  <!-- Export -->
  <div id="export-modal" class="modal hidden">
    <form id="export-form" class="modal-card" novalidate>
      <div class="modal-head">
        <h2 class="modal-title">Export to CSV</h2>
        <span id="export-count" class="modal-sub"></span>
      </div>

      <label class="form-label">
        <span>Project</span>
        <select id="x-project" class="field"></select>
      </label>

      <label class="form-label">
        <span>Period</span>
        <select id="x-preset" class="field">
          <option value="week">This week</option>
          <option value="month" selected>This month</option>
          <option value="last-month">Last month</option>
          <option value="30">Last 30 days</option>
          <option value="all">All time</option>
          <option value="custom">Custom range</option>
        </select>
      </label>

      <div class="form-row horizontal">
        <label class="form-label">
          <span>From</span>
          <input id="x-from" class="field" type="date" />
        </label>
        <label class="form-label">
          <span>To</span>
          <input id="x-to" class="field" type="date" />
        </label>
      </div>

      <div class="form-foot">
        <span></span>
        <span id="x-error" class="form-error"></span>
      </div>

      <div class="modal-actions">
        <button id="x-cancel" class="button ghost" type="button">Cancel</button>
        <button id="x-save" class="button primary" type="submit">Export</button>
      </div>
    </form>
  </div>

  <!-- Confirmation -->
  <div id="confirm" class="modal hidden">
    <div class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="modal-title">Delete?</h2>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="button ghost" type="button">Cancel</button>
        <button id="confirm-ok" class="button danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
